require:
  - ./.rubocop/cop/cursor/blank_line_after_guard_clause.rb
  - ./.rubocop/cop/cursor/no_struct_new.rb
  - ./.rubocop/cop/cursor/controller_query_chains.rb
  - ./.rubocop/cop/cursor/complex_guard_condition.rb
  - ./.rubocop/cop/cursor/service_literal_hash_boundary.rb

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Exclude:
    - '.env.example'
    - 'vendor/bundle/**/*'

Metrics/BlockLength:
  Exclude:
    - 'spec/services/dungeon_master/ai_client_retry_spec.rb'
    - 'spec/services/dungeon_master/evaluator_transport_retry_spec.rb'
    - 'spec/services/dungeon_master/rules/lookup_spec.rb'
    - 'spec/services/dungeon_master/steps/roll_request/adapter_spec.rb'
    - 'spec/services/dungeon_master/steps/combat_roll_request/adapter_spec.rb'
    - 'spec/services/combat/narrator_spec.rb'
    - 'spec/services/combat/social_event_trigger_spec.rb'
    - 'lib/tasks/dungeon_master_rules.rake'

Metrics/AbcSize:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/ClassLength:
  Max: 150

Metrics/ModuleLength:
  Max: 150

Style/FrozenStringLiteralComment:
  Exclude:
    - 'spec/services/dungeon_master/ai_client_retry_spec.rb'
    - 'spec/services/dungeon_master/evaluator_transport_retry_spec.rb'

Style/StringLiterals:
  Exclude:
    - 'spec/services/dungeon_master/ai_client_retry_spec.rb'
    - 'spec/services/dungeon_master/evaluator_transport_retry_spec.rb'

Cursor/BlankLineAfterGuardClause:
  Enabled: true

Cursor/NoStructNew:
  Enabled: true
  Exclude:
    - 'spec/services/dungeon_master/ai_client_retry_spec.rb'

Cursor/ControllerQueryChains:
  Enabled: true

Cursor/ComplexGuardCondition:
  Enabled: true

Cursor/ServiceLiteralHashBoundary:
  Enabled: true
