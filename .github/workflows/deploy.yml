name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            if [ ! -d ~/app ]; then
              git clone git@github.com:xcudder/rpg-tools.git ~/app
            fi
            cd ~/app

            echo "--- Pulling latest code ---"
            git fetch origin main
            git reset --hard origin/main

            echo "--- Writing .env ---"
            printf 'RAILS_MASTER_KEY=%s\nOPENAI_API_KEY=%s\nPOSTGRES_PASSWORD=%s\nDATABASE_URL=%s\nREDIS_URL=%s\nRESEND_API_KEY=%s\nSENTRY_DSN=%s\nGOOGLE_CLIENT_ID=%s\nGOOGLE_CLIENT_SECRET=%s\nGOOGLE_OAUTH_REDIRECT_URI=%s\nAXIOM_API_KEY=%s\nAXIOM_DATASET=%s\nAWS_S3_ACCESS_KEY_ID=%s\nAWS_S3_SECRET_ACCESS_KEY=%s\nAWS_S3_BUCKET=%s\nAWS_S3_REGION=%s\n' \
              '${{ secrets.RAILS_MASTER_KEY }}' \
              '${{ secrets.OPENAI_API_KEY }}' \
              '${{ secrets.POSTGRES_PASSWORD }}' \
              'postgres://exercises:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/exercises_production' \
              'redis://redis:6379/0' \
              '${{ secrets.RESEND_API_KEY }}' \
              '${{ secrets.SENTRY_DSN }}' \
              '${{ secrets.GOOGLE_CLIENT_ID }}' \
              '${{ secrets.GOOGLE_CLIENT_SECRET }}' \
              '${{ vars.GOOGLE_OAUTH_REDIRECT_URI }}' \
              '${{ secrets.AXIOM_API_KEY }}' \
              '${{ vars.AXIOM_DATASET }}' \
              '${{ secrets.AWS_S3_ACCESS_KEY_ID }}' \
              '${{ secrets.AWS_S3_SECRET_ACCESS_KEY }}' \
              '${{ vars.AWS_S3_BUCKET }}' \
              '${{ vars.AWS_S3_REGION }}' \
              > .env

            echo "--- Building images ---"
            docker compose -f docker-compose.prod.yml build

            echo "--- Starting services ---"
            docker compose -f docker-compose.prod.yml up -d

            echo "--- Waiting for app to be ready ---"
            timeout 60 bash -c \
              'until docker compose -f docker-compose.prod.yml exec -T app bundle exec rails runner "puts :ok" RAILS_ENV=production 2>/dev/null; do sleep 3; done'

            echo "--- Running migrations ---"
            docker compose -f docker-compose.prod.yml exec -T app \
              bundle exec rails db:prepare RAILS_ENV=production

            echo "--- Deploy complete ---"
