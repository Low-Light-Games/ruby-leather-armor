name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rspec:
    name: RSpec
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: exercises
          POSTGRES_PASSWORD: sekret
          POSTGRES_DB: exercises_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_URL_TEST: postgres://exercises:sekret@localhost:5432/exercises_test

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Load schema
        run: bundle exec rails db:schema:load

      - name: Run RSpec
        run: bundle exec rspec
