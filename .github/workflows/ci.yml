name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  request-specs:
    name: Request Specs (${{ matrix.shard_name }})
    runs-on: ubuntu-latest
    environment: Test
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard_index: 0
            shard_total: 2
            shard_name: 1/2
          - shard_index: 1
            shard_total: 2
            shard_name: 2/2

    services:
      postgres:
        image: pgvector/pgvector:pg15
        credentials:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          POSTGRES_USER: exercises
          POSTGRES_PASSWORD: sekret
          POSTGRES_DB: exercises_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_URL_TEST: postgres://exercises:sekret@localhost:5432/exercises_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Build assets
        run: yarn build

      - name: Load schema
        run: bundle exec rails db:schema:load

      - name: Enforce Cursor RuboCop architecture cops
        run: bundle exec rubocop --only Cursor/BlankLineAfterGuardClause,Cursor/NoStructNew,Cursor/ControllerQueryChains,Cursor/ComplexGuardCondition,Cursor/ServiceLiteralHashBoundary

      - name: Forbid Thread.new in app/ (use Node fan_out or Sidekiq)
        run: |
          if grep -rE 'Thread\.new[[:space:]]+do|Thread\.new[[:space:]]*\{' app --include='*.rb' -q; then
            grep -rEn 'Thread\.new[[:space:]]+do|Thread\.new[[:space:]]*\{' app --include='*.rb'
            exit 1
          fi

      - name: Run request specs for shard
        run: |
          mapfile -t SPEC_FILES < <(ruby scripts/ci/request_spec_shard.rb ${{ matrix.shard_index }} ${{ matrix.shard_total }})
          test "${#SPEC_FILES[@]}" -gt 0
          bundle exec rspec --format progress "${SPEC_FILES[@]}"
