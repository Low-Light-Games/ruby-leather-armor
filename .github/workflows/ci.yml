name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rspec:
    name: RSpec
    runs-on: ubuntu-latest
    environment: Test

    services:
      postgres:
        image: postgres:15
        credentials:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          POSTGRES_USER: exercises
          POSTGRES_PASSWORD: sekret
          POSTGRES_DB: exercises_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_URL_TEST: postgres://exercises:sekret@localhost:5432/exercises_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Build assets
        run: yarn build

      - name: Load schema
        run: bundle exec rails db:schema:load

      - name: Forbid Thread.new in app/ (use Node fan_out or Sidekiq)
        run: |
          if grep -rE 'Thread\.new[[:space:]]+do|Thread\.new[[:space:]]*\{' app --include='*.rb' -q; then
            grep -rEn 'Thread\.new[[:space:]]+do|Thread\.new[[:space:]]*\{' app --include='*.rb'
            exit 1
          fi

      - name: Run RSpec
        run: bundle exec rspec
