name: E2E Tests

on:
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:

jobs:
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    environment: Test

    # Run when the PR carries the "e2e" label, or when triggered manually.
    if: |
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e')) ||
      github.event_name == 'workflow_dispatch'

    services:
      postgres:
        image: pgvector/pgvector:pg15
        credentials:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          POSTGRES_USER: exercises
          POSTGRES_PASSWORD: sekret
          POSTGRES_DB: exercises_playwright
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: playwright
      DATABASE_URL: postgres://exercises:sekret@localhost:5432/exercises_playwright
      EVALUATOR_URL: http://localhost:3001
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Telemetry — events tagged `environment: playwright` by AxiomShipper.
      # Add AXIOM_API_KEY + AXIOM_DATASET to the `Test` GitHub Environment
      # (Settings → Environments → Test → Add secret) to opt in. Absent
      # values make ShipPlayLogJob short-circuit cleanly.
      AXIOM_API_KEY: ${{ secrets.AXIOM_API_KEY }}
      AXIOM_DATASET: ${{ secrets.AXIOM_DATASET }}

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Build assets
        run: yarn build

      - name: Prepare database
        run: bundle exec rails db:prepare db:seed

      - name: Install evaluator deps
        run: cd evaluator && npm ci --omit=dev

      - name: Start evaluator (background)
        # Rails calls into this on every action, so it must be running before
        # `playwright test` boots the Rails server. Health-check via /health
        # before continuing so we don't race the first request.
        run: |
          cd evaluator && node src/index.js > "$RUNNER_TEMP/evaluator.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/evaluator.pid"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/health >/dev/null 2>&1; then
              echo "evaluator ready"; exit 0
            fi
            sleep 1
          done
          echo "evaluator did not become ready"; cat "$RUNNER_TEMP/evaluator.log"; exit 1

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('yarn.lock') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright system deps (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Stop evaluator
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/evaluator.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/evaluator.pid")" 2>/dev/null || true
          fi

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
