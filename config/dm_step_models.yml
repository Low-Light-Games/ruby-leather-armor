# Per-step model + reasoning_effort assignments for the DM pipeline.
#
# This file is the SINGLE SOURCE OF TRUTH. It supersedes the per-step model
# overrides that used to live in DmConfig (DB-backed admin UI). Versioning
# this in the repo means dev / staging / playwright / prod all agree on
# which model handles each step — no more "it works in dev but the e2e
# environment has a different model assignment" drift.
#
# How it's read: app/services/dm_step_models_config.rb caches the parsed
# YAML at boot. DmConfig#model_for(step) and #reasoning_effort_for(step)
# delegate here. Resolution order, per step:
#
#   1. step_models[step] / step_reasoning_efforts[step]  (override)
#   2. default_model / default_reasoning_effort           (global fallback)
#
# Models marked "reasoning models" (gpt-5-*, o3-*, o4-*) accept
# reasoning_effort. Non-reasoning models silently ignore it (AiClient
# strips the param). Effort values: minimal | low | medium | high.
#
# Hint copy for each step: app/services/ai/step_registry/model_hints.rb

default_model: gpt-5-nano
default_reasoning_effort: minimal

# Per-step model overrides. Empty hash = every step uses default_model.
step_models: {}

# Per-step reasoning_effort overrides. Empty hash = every step uses
# default_reasoning_effort. Only meaningful when the resolved model is a
# reasoning model.
step_reasoning_efforts: {}
