rest_and_recovery:
  name: "Rest and Recovery"
  text: |
    A full night's rest (8 hours) restores 1 HP per character level.
    Complete bed rest (24 hours) restores 2 HP per character level.
    Rest can be interrupted; 1 hour of interruption does not prevent rest
    if total sleep reaches 8 hours.
    More than 1 hour of interruption requires restarting the 8-hour period.
    Characters need 8 hours of rest to avoid fatigue.

spell_preparation:
  name: "Spell Preparation"
  text: |
    Prepared casters (Wizard, Cleric, Druid) need 8 hours of rest then 1 hour
    of preparation to regain spell slots.
    Spontaneous casters (Sorcerer, Bard) need 8 hours of rest to regain slots.
    Interrupted rest: if rest is incomplete, previously used spell slots are not regained.
    A caster may leave some slots open and fill them later with 15 minutes of preparation.

random_encounters:
  name: "Random Encounters During Rest"
  text: |
    Standard watch rotation: each party member takes a shift.
    During rest in dangerous areas, check for random encounters once per rest period.
    Characters on watch are not surprised; sleeping characters are flat-footed.
    Light sleepers (Perception check DC 20 - encounter's noise level) may wake.
    Waking from sleep is a full-round action (no standard or move actions the first round).

healing_and_conditions:
  name: "Natural Healing and Condition Recovery"
  text: |
    Ability damage: heal 1 point per ability per night of rest, 2 with complete bed rest.
    Fatigue: 8 hours of rest removes fatigued condition.
    Exhaustion: 1 hour of rest reduces to fatigued; then follow fatigue rules.
    Treat Deadly Wounds (Heal DC 20): restore 1 HP per level, once per day per patient.
    Long-term care (Heal DC 15): patient recovers 2x normal HP for that day.
