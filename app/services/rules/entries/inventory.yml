potion_use:
  name: "Using Potions"
  text: |
    Drinking a potion is a standard action that provokes attacks of opportunity.
    Administering a potion to an unconscious ally is a full-round action.
    Potions use the minimum caster level for the spell.
    Potion effects activate immediately; no concentration required.

item_identification:
  name: "Identifying Magic Items"
  text: |
    Detect Magic + Spellcraft (DC 15 + item's caster level): identifies properties.
    Identify spell: automatic success for most items (but costs a 1st-level slot).
    Cursed items: Spellcraft identifies them as their non-cursed equivalent
    unless the check exceeds the DC by 5+.
    Artifacts cannot be identified by Spellcraft; require lore or research.

equipping_gear:
  name: "Equipping and Removing Gear"
  text: |
    Don armor: varies by type (light 1 min, medium 4 min, heavy 4 min with help).
    Don hastily: half time but -1 AC and armor check penalty doubled.
    Remove armor: light 1 min, medium 1 min, heavy 1d4+1 min.
    Draw a weapon: move action (free action with BAB +1 or Quick Draw feat).
    Retrieve stored item: move action that provokes attacks of opportunity.

encumbrance:
  name: "Encumbrance"
  text: |
    Light load: no penalty. Medium load: max Dex +3, check penalty -3, 3/4 speed.
    Heavy load: max Dex +1, check penalty -6, 1/3 speed, run x3 only.
    Carrying capacity based on Strength score.
    Str 10 = 33/66/100 lbs (light/medium/heavy).
    Quadrupeds carry 1.5x listed amounts.

wand_and_scroll_use:
  name: "Using Wands and Scrolls"
  text: |
    Wands: Use Magic Device DC 20, or the spell must be on your class list.
    Activation is a standard action (same as casting the spell).
    Scrolls: must be on your class list OR Use Magic Device DC 20 + caster level.
    Scroll mishap on failed UMD by 10+: scroll is wasted.
    Caster level check required if scroll CL exceeds yours (DC = scroll CL + 1).
