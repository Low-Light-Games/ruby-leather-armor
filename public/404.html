<!DOCTYPE html>
<html lang="en">
<head>
  <title>The page you were looking for doesn't exist (404)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: hsl(40, 30%, 88%);
      color: hsl(20, 15%, 15%);
      font-family: 'IM Fell English', Georgia, serif;
      font-size: 18px;
      line-height: 1.7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .error-page {
      width: 95%;
      max-width: 480px;
      text-align: center;
    }

    .error-page__code {
      font-family: 'Courier Prime', 'Courier New', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      color: hsl(20, 10%, 40%);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .error-page__title {
      font-family: 'IM Fell English SC', Georgia, serif;
      font-size: 1.6rem;
      font-weight: normal;
      color: hsl(0, 50%, 30%);
      letter-spacing: 0.04em;
      margin: 0 0 0.5rem;
    }

    .error-page__divider {
      border: none;
      border-top: 1px solid hsl(20, 12%, 55%);
      width: 4rem;
      margin: 1.2rem auto;
    }

    .error-page__body {
      background-color: hsl(40, 25%, 82%);
      border: 1px solid hsl(20, 12%, 55%);
      padding: 1.5rem 2rem;
      margin-bottom: 1.5rem;
    }

    .error-page__body p {
      margin: 0 0 0.75rem;
    }

    .error-page__body p:last-child {
      margin-bottom: 0;
    }

    .error-page__note {
      font-family: 'Courier Prime', 'Courier New', monospace;
      font-size: 0.72rem;
      color: hsl(20, 10%, 40%);
      letter-spacing: 0.06em;
    }

    .error-page__link {
      display: inline-block;
      margin-top: 1.5rem;
      font-family: 'IM Fell English SC', Georgia, serif;
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      color: hsl(20, 15%, 15%);
      text-decoration: none;
      border: 1px solid hsl(20, 12%, 55%);
      padding: 0.4rem 1.2rem;
    }

    .error-page__link:hover {
      background-color: hsl(40, 25%, 82%);
    }
  </style>
</head>

<body>
  <!-- This file lives in public/404.html -->
  <div class="error-page">
    <p class="error-page__code">Error 404</p>
    <h1 class="error-page__title">This Path Does Not Exist</h1>
    <hr class="error-page__divider">
    <div class="error-page__body">
      <p>The page you sought has not been found — perhaps it never was, or perhaps it moved deeper into the dungeon.</p>
      <p>You may have mistyped the address, or the passage may have collapsed.</p>
    </div>
    <p class="error-page__note">If you are the application owner, consult the logs.</p>
    <a href="/" class="error-page__link">Return to the Entrance</a>
  </div>
</body>
</html>
