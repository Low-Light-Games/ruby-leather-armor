services:
  app:
    build:
      context: ./
      args:
        RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
        RAILS_ENV: staging
    env_file:
      - .env
    environment:
      RAILS_ENV: staging
      NODE_ENV: production
      RAILS_MAX_THREADS: "12"
    network_mode: host
    restart: unless-stopped
