services:
  app:
    build:
      context: ./
      args:
        RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
        RAILS_ENV: staging
    env_file:
      - .env
    environment:
      RAILS_ENV: staging
      NODE_ENV: production
      RAILS_MAX_THREADS: "12"
    network_mode: host
    restart: unless-stopped

  worker:
    build:
      context: ./
      args:
        RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
        RAILS_ENV: staging
    env_file:
      - .env
    environment:
      RAILS_ENV: staging
      RAILS_MAX_THREADS: "12"
      EVALUATOR_URL: http://localhost:3001
    network_mode: host
    restart: unless-stopped
    command: bundle exec sidekiq -C config/sidekiq.yml

  evaluator:
    build:
      context: ./
      args:
        RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
        RAILS_ENV: staging
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
    network_mode: host
    restart: unless-stopped
    command: node evaluator/src/index.js
